# arrows. The protected field is the only authoritative signal — checking
# motion magnitude is unreliable because arrows retain small residual motion
# from sub-tick collision (see AbstractArrow.onHitBlock).
public net.minecraft.world.entity.projectile.AbstractArrow inGround

# Expose setPierceLevel so modular arrows can opt in to vanilla piercing.
# Vanilla made it private in 1.21 because piercing is normally driven by
# weapon enchantments; we drive it from the shaft material (dark_oak).
public net.minecraft.world.entity.projectile.AbstractArrow setPierceLevel(B)V
